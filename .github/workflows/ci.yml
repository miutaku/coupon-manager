name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: dotnet restore CouponManager.slnx
      - run: dotnet format CouponManager.slnx --verify-no-changes --no-restore
      - run: dotnet build CouponManager.slnx -c Release --no-restore
      - run: dotnet test tests/CouponManager.Domain.Tests -c Release --no-build
      - run: dotnet test tests/CouponManager.Api.Tests -c Release --no-build
      - run: docker build -f src/CouponManager.Api/Dockerfile -t coupon-manager-api:test .
      - run: docker build -f src/CouponManager.Web/Dockerfile -t coupon-manager-web:test .
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: dotnet restore tests/CouponManager.Ui.Tests
      - run: dotnet build tests/CouponManager.Ui.Tests -c Release --no-restore
      - run: pwsh tests/CouponManager.Ui.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - run: docker compose up -d --build
      - run: curl --retry 20 --retry-delay 3 --retry-all-errors http://localhost:8080
      - run: dotnet test tests/CouponManager.Ui.Tests -c Release --no-build
        env: { E2E_BASE_URL: "http://localhost:8080" }
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
