<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6750a4">
  <title>オフライン | クーポンマネージャー</title>
  <style>
    :root{color-scheme:light dark;font-family:"Noto Sans JP",system-ui,sans-serif;background:#f9f9ff;color:#1d1b20}*{box-sizing:border-box}body{min-height:100dvh;display:grid;place-items:center;margin:0;padding:28px;background:#f9f9ff}.card{width:min(420px,100%);padding:34px;border-radius:32px;background:#f1ecf4;text-align:center;box-shadow:0 8px 24px #1d1b2018}.icon{width:88px;height:88px;border-radius:24px}h1{margin:22px 0 8px;font-size:1.45rem}p{margin:0 0 24px;color:#49454f;line-height:1.7}button{min-height:48px;padding:0 24px;border:0;border-radius:24px;color:#fff;background:#6750a4;font:inherit;font-weight:700;cursor:pointer}button:active{transform:scale(.96)}@media(prefers-color-scheme:dark){:root,body{background:#121212;color:#e6e1e5}.card{background:#211f22}.card p{color:#cac4d0}}
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="/icons/app-icon-192.png" alt="">
    <h1 id="title">オフラインです</h1>
    <p id="body">クーポンを安全に更新するには、ネットワーク接続が必要です。</p>
    <button id="retry" type="button">再接続する</button>
  </main>
  <script>
    if (!navigator.language.toLowerCase().startsWith("ja")) {
      document.documentElement.lang = "en";
      document.title = "Offline | Coupon Manager";
      document.getElementById("title").textContent = "You're offline";
      document.getElementById("body").textContent = "A network connection is required to update your coupons safely.";
      document.getElementById("retry").textContent = "Try again";
    }
    document.getElementById("retry").addEventListener("click", () => location.reload());
    addEventListener("online", () => location.reload());
  </script>
</body>
</html>
